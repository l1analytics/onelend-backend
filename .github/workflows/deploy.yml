name: Deployment (Create)

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP_NAME: '${{ vars.RESOURCE_GROUP_NAME }}-${{ github.ref_name }}'
  location: eastus
  AZURE_FUNCTIONAPP_NAME: '${{ vars.FUNCTIONAPP_NAME }}-${{ github.ref_name }}'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src'       # set this to the path to your function app project, defaults to the repository root
  NODE_VERSION: '20.x'     

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    #environment: dev
    #needs:  deployment
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v3
    
    - name: Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Node ${{ env.NODE_VERSION }} Environment
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Resolve Project Dependencies Using Npm'
      shell: bash
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        npm install
        npm run build --if-present
        npm run test --if-present
        popd

    - name: 'Run Azure Functions Action'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        sku: flexconsumption
        remote-build: true
        #publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
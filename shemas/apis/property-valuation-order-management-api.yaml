            type: string
            format: date
          dateOrdered:
            $ref: '#/components/schemas/Timestamp'
          dateCompleted:
            $ref: '#/components/schemas/Timestamp'
          feeAmount:
            type: number
            format: double

    AvmResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/AvmOrderMetadata'
        data:
          $ref: '#/components/schemas/AvmResult'

    AvmValues:
      description: AVM values for the subject property
      type: object
      properties:
        marketValue:
          description: The AVM’s prediction of market value for the given property. If isRetro == TRUE, then this will be the Market Value for the given property, as of the effective date provided.
          type: integer
        lowValue:
          description: A numeric value representing the lower bounds of the estimated market value of the subject property.
          type: integer
        highValue:
          description: A numeric value representing the estimated upper  bounds of the estimated market value of the subject property.
          type: integer
        confidenceScore:
          description: The confidence associated with the AVM. This value can be expressed in either numeric or string based on the provider's communicating confidence.
          type: string
        confidenceScoreAlt:
          description: An alternative way of describing confidence associated with the AVM. This value can be expressed in either numeric or string and can change by provider.
          type: string
        forecastStdDev:
          description: "If supported by the AVM Provider used, this will be a Numeric value representing the Forecasted Standard Deviation (FSD), a numeric indicator between 0 and 1, tied to the AVM prediction. Note: FSD methodology varies among AVM providers."
          type: number
          format: float
        dateEffective:
          type: string
          format: date

    AvmResult:
      type: object
      allOf:
        - $ref: '#/components/schemas/AvmValues'
        - properties:
            providerKey:
              description: The key/ID of the Provider that returned the AVM.
              type: string
            providerModel:
              description: Provider model name of the AVM returned.
              type: string
            providerName:
              description: The name of the provider that returned the AVM.
              type: string
            termsOfUse:
              type: string
              description: The terms of usage for the AVM Products returned.
            subject:
              type: object
              properties:
                propertyDetails:
                  $ref: '#/components/schemas/PropertyDetails'
                publicRecordsCharacteristics:
                  $ref: '#/components/schemas/PropertyCharacteristics'
                mlsCharacteristics:
                  $ref: '#/components/schemas/PropertyCharacteristics'
                listingHistory:
                  type: array
                  items:
                    $ref: "#/components/schemas/ListingEvent"
            comparables:
              type: object
              properties:
                soldCompsMessage:
                  type: string
                  description: A message usually indicating that Sold Comps were not available to be returned at this time.
                soldComps:
                  type: array
                  items:
                    $ref: "#/components/schemas/AvmComparableProperty"
                listCompsMessage:
                  type: string
                  description: A message usually indicating that List Comps were not available to be returned at this time.
                listComps:
                  type: array
                  items:
                    $ref: "#/components/schemas/AvmComparableProperty"


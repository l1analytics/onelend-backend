        '500':
          description: Internal Server Error

  /orders/{orderId}/cancels:
    post:
      tags:
        - Order Management
      summary: cancel an order
      operationId: cancelOrder
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Successfully submitted request to cancel. Watch your webhook logs for the SNS subscription confirmation
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '409':
          description: Conflict; Order is in a status that does not support this operation
        '500':
          description: Internal Server Error

  /orders/{orderId}/contacts:
    post:
      tags:
        - Order Management
      summary: add contact(s) to the order
      operationId: addContacts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Contact'
      responses:
        '200':
          description: Successfully added contact(s) to order.
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '409':
          description: Conflict; Order is in a status that does not support this operation
        '500':
          description: Internal Server Error

  /orders/{orderId}/documents:
    post:
      tags:
        - Order Management
      summary: request to upload a document
      description: |
        Returns an AWS presigned upload url which can then be used to provide documents to Clear Capital. 
        See https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html for more information
        <br><br>**Please Note:** All uploads use a content-type header of *null* regardless of mime type for the document getting uploaded
      operationId: getDocumentUploadUrl
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrl'
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '500':
          description: Internal Server Error

    get:
      tags:
        - Order Management
      summary: request to get documents associated with an order
      description: |
        Returns a list of all documents associated with an order
      operationId: getOrderDocumentList
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '500':
          description: Internal Server Error

  /orders/{orderId}/documents/{documentId}:
    get:
      tags:
        - Order Management
      summary: retrieve document via 302 redirect
      operationId: getDocumentById
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: document contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to signed document download
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order or Document cannot be found
        '500':
          description: Internal Server Error

  /orders/{orderId}/export:
    get:
      tags:
        - Order Management
      summary: get the raw data for the deliverable
      operationId: getDeliverableData
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          description: Invalid status. Data only available on completed orders
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '500':
          description: Internal Server Error

  /orders/{orderId}/holds:
    post:
      tags:
        - Order Management
      summary: add/update a customer requested hold
      operationId: setHold
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: Successfully submitted hold request.  Watch your webhook logs for the SNS subscription confirmation
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '409':
          description: Conflict; Order is in a status that does not support this operation
        '500':
          description: Internal Server Error

    delete:
      tags:
        - Order Management
      summary: remove all customer requested hold(s)
      operationId: removeHold
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Successfully removed any Customer Requested holds. Report can still be on hold at ClearCapital for other reasons
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '409':
          description: Conflict; Order is in a status that does not support this operation
        '500':
          description: Internal Server Error

  /orders/{orderId}/messages:
    post:
      tags:
        - Order Management
      summary: add a message to the order
      operationId: addMessage
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Successfully added a message to the order.
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '500':
          description: Internal Server Error

  /orders/{orderId}/revisions:
    post:
      tags:
        - Order Management
      summary: submit a revision request
      operationId: submitRevisionRequest
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: Successfully submitted revision request.
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order cannot be found
        '409':
          description: Conflict; Order is in a status that does not support this operation
        '500':
          description: Internal Server Error

  /orders/avm:
    post:
      tags:
        - Order Management
      summary: Submits a request to place a new AVM order.
      description: |
        Submits a request to place a new AVM order. See Product Descriptions for additional ordering options and rules
      operationId: orderCreateAvm
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestAvm'
            examples:
              AVM:
                value:  {
                  "product": "CLEAR_AVM_FULLY_SUPPORTED",
                  "address": {
                    "street": "123 Main St",
                    "unitNumber": "22",
                    "city": "Springfield",
                    "state": "IL",
                    "zipcode": "12345"
                  }
                }

      responses:
        '200':
          description: AVM successfully processed, details are included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvmResponse'
        '204':
          description: No Hit - AVM was not able to be processed, either address is invalid or no data was available
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '500':
          description: Internal Server Error


  /products:
    get:
      tags:
        - Order Management
      summary: Get a list of available Products and the configured pricing
      description: |
        Returns a list of the Products and their pricing as configured for the Customer Account.
        Return a base price if the address is not provided.  Appraisal products require a complete address for adjusted pricing, the final price may vary if the location of the address cannot be automatically determined or needs to be adjusted.
        Turn times and estimated due dates are calculated based on the time of day the order is submitted.  Additionally, business vs calendar day calculations are specific to each customer.
      operationId: getProducts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: products
          schema:
            type: array
            items:
              type: string
          description: A set of product codes to filter by, if not provided all configured products will be returned
          style: form
          explode: true
        - in: query
          name: limitPricesBy
          schema:
            $ref: '#/components/schemas/ProductRequestLimitPricesByEnum'
          description: |
            If populated, limits the returned prices to a single value per product.  If not specified all configured prices/turn times will be returned for each product. |
            If DEFAULT is used, then the price/turn time will be the value if an order is placed with no due date or rush provided. This will be the longest configured turn time. |
            If CLOSEST_DUE_DATE is used, then a dueDate must be populated and the price/turn time that most closely matches the provided date will be returned.
            If RUSH is used then the price for the shortest available turn time will be returned.
        - in: query
          name: dueDate
          schema:
            type: string
            format: date
          description: The requested due date which is required if the limitPricesBy value is CLOSEST_DUE_DATE, it should not be populated for other options
        - in: query
          name: street
          schema:
            type: string
          description: customer supplied street address
        - in: query
          name: city
          schema:
            type: string
          description: customer supplied city
        - in: query
          name: state
          schema:
            type: string
          description: customer supplied state
        - in: query
          name: zipcode
          schema:
            type: string
          description: customer supplied zip
        - in: query
          name: unitNumber
          schema:
            type: string
          description: customer supplied unit number
      responses:
        '200':
          description: An array of products and the associated pricing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '500':
          description: Internal Server Error

  ## Webhook API Definitions
  /events/subscription:
    post:
      tags:
        - Order Management Webhook API
      summary: Creates a subscription for the given webhook to be called with order management events
      description: |
        The supplied URL must comply with AWS SNS webhook conventions described here. https://docs.aws.amazon.com/sns/latest/dg/sns-subscribe-https-s-endpoints-to-topic.html
        Currently, only one webhook is allowed per customer per environment. The supplied webhook URL will be sent a SubscriptionConfirmation notification with a SubscribeURL.
        You must visit the SubscribeURL to activate the subscription.
        
        **See Callbacks tab below for more information on events you may receive**
      operationId: subscribeOrdermanagement
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
      responses:
        '200':
          description: Successfully subscribed.  Watch your webhook logs for the SNS subscription confirmation
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '500':
          description: Internal Server Error
      callbacks:
        Events:
          '{$request.body#/url}':
            post:
              summary: Customer supplied URL to be called with order management events
              requestBody:
                $ref: '#/components/requestBodies/WebhookBody'
              responses:
                '200':
                  description: OK

    delete:
      tags:
        - Order Management Webhook API
      summary: Removes the organizations subscription
      description: After calling this method your webhook will no longer receive notifications
      operationId: unsubscribeOrderManagement
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successfully unsubscribed from webhook events
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '500':
          description: Internal Server Error

  ## Mocked SNS Order Management
  /mock:
    post:
      tags:
        - Mock Order Management (Test Only)
      summary: Mock Order Management Events
      operationId: mockOrderEvent
      description: |
        Mock SNS Order Management
        
        **See Callbacks tab below for more information on events you may receive**
        
        <sup>**Callbacks will send the MOCKED order management event to your subscribed URL.**</sup>
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: event
          required: true
          description:  |
            - OrderAccepted
            - OrderDeclined
            - OrderAssigned
            - OrderCompleted
            - OrderCanceled
            - InspectionScheduled
            - InspectionCompleted
            - HoldAdded
            - HoldRemoved
            - MessageAdded
            - EstimatedCompletionDateChanged
            - RevisionRequestDenied
            - UnderReview
          schema:
            $ref: '#/components/schemas/EventType'
        - in: query
          name: orderId
          required: true
          schema:
            type: string
          description: orderId to mock event with
        - in: query
          name: referenceIdentifier
          schema:
            type: string
          description: reference identifier to mock event with            
      responses:
        '200':
          description: Successfully Mocked Event Pushed to Customer Subscribed Webhook.
        '400':
          description: Invalid input
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '500':
          description: Internal Server Error
      callbacks:
        Events:
          'subscribed-webhook':
            post:
              summary: Customer supplied URL to be called with MOCKED order management events
              requestBody:
                $ref: '#/components/requestBodies/WebhookBody'
              responses:
                '200':
                  description: OK

  /mock/orders/{orderId}/documents/{documentId}:
    get:
      tags:
        - Mock Order Management (Test Only)
      summary: Mock retrieve document via 302 redirect
      operationId: getMockDocumentById
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: document contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to signed document download
        '401':
          description: API key is missing or invalid
        '403':
          description: Forbidden; User does not have the correct permissions
        '404':
          description: Order or Document cannot be found
        '500':
          description: Internal Server Error

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer

    TenantId:
      name: x-tenant-id
      in: header
      required: false
      description: Required in multi-tenant integrations such as a Loan Origination System submitting on behalf of its customers
      schema:
        type: string

  schemas:
    Address:
      type: object
      required:
        - street
        - zipcode
      properties:
        street:
          type: string
          description: customer supplied street address
        city:
          type: string
          description: customer supplied city
        state:
          type: string
          description: customer supplied state
        zipcode:
          type: string
          description: customer supplied zip
        unitNumber:
          type: string
          description: customer supplied unit number
        apn:
          type: string
          description: assessors parcel number

    CancelRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string

    Contact:
      type: object
      required:
        - firstName
        - type
      properties:
        firstName:
          type: string
        lastName:
          type: string
        type:
          type: string
          description: |
            - BORROWER
            - HOMEOWNER
            - LISTING_AGENT
            - LOAN_PROCESSOR
            - ORDER_REQUESTOR
            - SELLING_AGENT
            - TENANT
            - OTHER
        email:
          type: string
          description: |
            Required when no phone numbers are provided
        isInteriorAccess:
          type: boolean
          default: false
        phoneNumbers:
          type: array
          description: |
            At least one phone number is required if no email is provided
          items:
            $ref: '#/components/schemas/PhoneNumber'

    ExportResponse:
      type: object
      description: |
        - BrokerPriceOpinionExportResponse
        - EvaluationExportResponse
        - PropertyConditionInspectionExportResponse
        - PropertyDisasterInspectionExportResponse
        - CollateralDesktopAnalysisExportResponse

    Geo:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    PhoneNumber:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: |
            - HOME_PHONE
            - CELL_PHONE
            - WORK_PHONE
            - OTHER
        value:
          type: string

    ProductRequestLimitPricesByEnum:

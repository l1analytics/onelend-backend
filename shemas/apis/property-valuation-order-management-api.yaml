          type: array
          items:
            type: object
            properties:
              value:
                type: number
                description: vendor assigned value
              repairedValue:
                type: number
                description: the value that includes costs to repair
              repairCosts:
                type: number
                description: the total repair costs
              effectiveDate:
                type: string
                format: date
              signatureDate:
                type: string
                format: date
              vendorName:
                type: string
                description: vendor name
              benchmark:
                type: boolean
                description: source document used as basis for recon value
              variance:
                type: string
                description: variance of the source document value from the recon value
              sourceDocumentType:
                type: string
                description: |
                  - APPRAISAL
                  - BPO
        appraiser:
          $ref: '#/components/schemas/Vendor'


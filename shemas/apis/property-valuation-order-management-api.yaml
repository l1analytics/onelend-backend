
openapi: "3.0.2"
info:
  version: "1.40"
  title: Property Valuation API
servers:
  - url: https://api.onelend.com/property-valuation-order-management-api

paths:
  /orders:
    post:
      tags:
        - Order Management
      summary: Submits a request to place a new order.
      description: |
        Submits a request to place a new order. See Product Descriptions for additional ordering options and rules
      operationId: orderCreate
      security:

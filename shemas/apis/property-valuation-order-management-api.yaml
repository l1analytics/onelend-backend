        type: object
        description: The identifying AVM order information provided on each deliverable
        properties:
          orderId:
            $ref: '#/components/schemas/OrderId'
          product:
            type: string
            description: The product code being delivered
          loan:
            $ref: '#/components/schemas/Loan'
          suppliedAddress:
            $ref: '#/components/schemas/Address'
          trackingIdentifiers:
            type: array
            items:
              type: string
            maxItems: 3

    OrderRequest:
      type: object
      required:
        - address
        - product
        - loan
      properties:
        product:
          type: string
          description: |
            See Product Descriptions for additional ordering options and rules
        purpose:
          type: string
          description: |
            - PURCHASE
            - REFINANCE
            - SERVICING
            - PREFUNDING_DECISION
            - HOME_EQUITY
            - ASSET_VALUATION
            - APPRAISAL_UPDATE
            - DISTRESSED
            - CONSTRUCTION
            - OTHER
            - Note - BPOs ignore purpose values
        loan:
          $ref: '#/components/schemas/Loan'
        address:
          $ref: '#/components/schemas/Address'
        instructions:
          type: string
          description: any special instructions for the vendor to complete the report
        dueDate:
          description: the requested due date for the order. Must not be populated if turnTime is populated
          $ref: '#/components/schemas/Timestamp'
        turnTime:
          type: number
          description: the requested turn time in hours, should match a valid turnTime from the getProducts response. Must not be populated if dueDate is populated
        rush:
          type: boolean
          default: false
          description: indicates if the order is a rush, is not used if a dueDate or turnTime is provided
        trackingIdentifiers:
          type: array
          items:
            type: string
          maxItems: 3
        paymentMethod:
          type: string
          description: |
            - INVOICE
            - PAYMENT_LINK
            - LENDER_CARD
          default:
            INVOICE
        paymentLinkEmail:
          type: string
          description: Recipient email for payment link. Required when paymentMethod = PAYMENT_LINK
        paymentReferenceNumber:
          type: string
          description: Used to provide a reference when payment is handled before placing the order.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        lenderClient:
          type: string
          description: Replaces Customer Name on Report.  Used if ordered on behalf of a different Lender or Client.
        investor:
          type: string
          description: Name of the related investor.
        referenceIdentifier:
          $ref: '#/components/schemas/ReferenceIdentifier'
        invoiceIdentifier:
          type: string
          description: An optional identifier that if passed on the order will be populated on the invoice pdf as the Customer Provided Unique Id.
        lockbox:
          type: string
          description: Lockbox code(s) or details that are needed to access the property


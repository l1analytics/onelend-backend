  /onelend/v1/businessContactSelector:
    post:
      tags:
        - Contacts > Business Contacts
      summary: 12 -  Query list of Business Contacts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                fields:
                  - ContactOwner.UserName
                  - ContactCategory.CategoryName
                  - ContactGroupCount.GroupCount
                  - ContactLoanCount.LoanCount
                  - ContactCompleteLoanCount.LoanCount
                  - Contact.FirstName
                  - Contact.LastName
                  - Contact.CompanyName
                  - Contact.JobTitle
                filter:
                  operator: Or
                  terms:
                    - canonicalName: Contact.BizState
                      matchType: isEmpty
                    - operator: And
                      terms:
                        - canonicalName: Contact.AccessLevel
                          value: Private
                          matchType: Exact
                        - canonicalName: Contact.FirstName
                          value: A
                          matchType: Contains
                  sortOrder:
                    - canonicalName: Contact.FirstName
                      order: Desc
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{ACCESS_TOKEN}}
        - name: start
          in: query
          schema:
            type: integer
          example: '0'
        - name: limit
          in: query
          schema:
            type: integer
          example: '100'
        - name: cursorType
          in: query
          schema:
            type: string
          example: RandomAccess
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}

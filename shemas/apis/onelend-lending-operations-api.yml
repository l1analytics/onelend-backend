paths:
  /oauth2/v1/token:
    post:
      tags:
        - Authentication > User Impersonation
      summary: 02a - Get Subject Impersonation Token
      description: ' New Token for CC User'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                grant_type:
                  type: string
                  example: urn:ietf:params:oauth:grant-type:token-exchange
                actor_token_type:
                  type: string
                  example: urn:ietf:params:oauth:token-type:access_token
                subject_user_id:
                  type: string
                  example: admin
                actor_token:
                  type: string
                  example: '{{TOKEN1}}'
                scope:
                  type: string
                  example: lp
                client_id:
                  type: string
                  example: '{{client_id}}'
                client_secret:
                  type: string
                  example: '{{client_secret}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /oauth2/v1/token/introspection:
    post:
      tags:
        - Authentication > User Impersonation
      summary: 02b - Introspect Subject Impersonation token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                token:
                  type: string
                  example: '{{TOKEN2}}'
      security:
        - basicAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /onelend/v3/loans:
    post:
      tags:
        - Secondary and Trades > Funding Templates
      summary: 02 - Create Loan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                applications:
                  - borrower:
                      firstname: FundingFees6
                borrowerRequestedLoanAmount: 100000
                fees:
                  - feeType: LoanOriginationFee
                    sellerPaidAmount: 100
                  - feeType: MortgageInspectionFee
                    sellerPaidAmount: 200
                  - feeType: ProcessingFee
                    sellerPaidAmount: 300
                  - feeType: UnderwritingFee
                    sellerPaidAmount: 400
                  - feeType: PrepaidInterest
                    sellerPaidAmount: 500
                  - feeType: MortgageInsurancePremium
                    sellerPaidAmount: 600
                  - feeType: HazardInsurance
                    sellerPaidAmount: 700
                  - feeType: MortgageInsurance
                    sellerPaidAmount: 800
                  - feeType: RecordingFee
                    BorPaidAmount: 900
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{ACCESS_TOKEN}}
        - name: Cookie
          in: header
          schema:
            type: string
          example: '{{Cookie}}'
        - name: loanfolder
          in: query
          schema:
            type: string
          example: My Pipeline
        - name: view
          in: query
          schema:
            type: string
          example: Entity
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}

      summary: 06 - Create Header Only Exit Icon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                instanceId: '{{instance}}'
                groupNamespace: loans
                groupId: 2D2A0AB8-6E96-47ED-9D33-75A5EE5349B5
                packageId: BF515766-456A-48EE-AC92-5EE82355A4DC
                recipientId: DC822BF3-6432-4CD9-99D9-277890B7142A
                userId: jdoe
                returnUrl: '{{POSF_PARTNER_PORTAL_RETURN}}'
                ui:
                  exit-button:
                    showIcon: true
      parameters:
        - name: Elli-Environment
          in: header
          schema:
            type: string
          description: >-
            The execution environment; used to prevent cross environment
            posting.
          example: '{{API_ENVIRONMENT}}'
        - name: Elli-SubscriptionId
          in: header
          schema:
            type: string
          description: >-
            This represents a unique integration for a partner. Once the request
            is received and the environment is validated this will be used to
            resolve an integration settings and validate the information is tied
            to that integration. An error will occur if the integration id does
            not exist or if the referenced entity is not associated to this
            integration.
          example: '{{POSF_PARTNER_SUBSCRIPTION_ID}}'
        - name: Elli-SigningKeyId
          in: header
          schema:
            type: string
          description: >-
            This represents which signing key to use and an error will occur if
            no signing key with this id exists in the provided subscription.
          example: '{{POSF_PARTNER_SIGNING_KEY_ID}}'
        - name: Elli-Signature
          in: header
          schema:
            type: string
          description: >-
            The signature of the request body based on the signing key
            associated to the provided signing key id. An error will occur if
            the calculated signature does not match that calculated on the
            server.
          example: '{{POSF_PARTNER_SIGNATURE}}'
      responses:
        '400':
          description: Successful response
          content:
            application/json: {}

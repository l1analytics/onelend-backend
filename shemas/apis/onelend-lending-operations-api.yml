  /onelend/v1/borrowerContactSelector:
    post:
      tags:
        - Contacts > Borrower Contacts
      summary: 12 - Query list of Borrower Contacts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                fields:
                  - Contact.FirstName
                  - Contact.Birthdate
                  - Contact.BizEmail
                  - Contact.MiddleName
                  - Contact.SuffixName
                  - Contact.AccessLevel
                filter:
                  operator: Or
                  terms:
                    - canonicalName: Contact.HomeState
                      value: CA
                      matchType: Exact
                    - operator: And
                      terms:
                        - canonicalName: Contact.AccessLevel
                          value: Private
                          matchType: Exact
                        - canonicalName: Contact.FirstName
                          value: A
                          matchType: Contains
                  sortOrder:
                    - canonicalName: Contact.FirstName
                      order: Desc
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{ACCESS_TOKEN}}
        - name: start
          in: query
          schema:
            type: integer
          example: '0'
        - name: limit
          in: query
          schema:
            type: integer
          example: '100'
        - name: cursorType
          in: query
          schema:
            type: string
          example: RandomAccess
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
